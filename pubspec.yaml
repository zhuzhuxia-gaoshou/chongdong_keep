name: chongdong_keep
description: "宠动Keep - 和宝贝一起运动打卡、养成健康习惯的宠物社交APP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.2

  # 本地存储
  shared_preferences: ^2.3.2

  # GPS定位
  geolocator: ^13.0.1

  # 网络请求
  http: ^1.2.2

  # 日期格式化
  intl: ^0.19.0

  # 权限管理
  permission_handler: ^11.3.1

  # 图片缓存
  cached_network_image: ^3.4.1

  # SVG支持
  flutter_svg: ^2.0.10

  # 图片选择
  image_picker: ^1.1.2

  # 路径管理
  path_provider: ^2.1.4

  # 截图分享
  screenshot: ^3.0.0
  share_plus: ^10.0.0

  # WebView（用于腾讯地图）
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
